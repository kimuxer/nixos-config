[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    border = "primary"
    border_width = 1.0
    capsule_fill = "surface"
    capsule_radius = 5
    capsule_thickness = 0.80000000000000004
    center = [ "group:g3" ]
    color = "secondary"
    contact_shadow = true
    end = [ "group:g2", "session" ]
    font_family = "Inter Display SemiBold"
    font_weight = 600
    margin_edge = 0
    margin_ends = 400
    radius = 5
    scale = 0.80000000000000004
    start = [ "group:g4", "group:g5" ]
    thickness = 26
    widget_spacing = 10

        [[bar.default.capsule_group]]
        fill = "surface"
        id = "g1"
        members = [ "notifications", "clipboard", "network", "volume" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.default.capsule_group]]
        fill = "surface"
        id = "g3"
        members = [ "clock", "audio_visualizer" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.default.capsule_group]]
        fill = "surface"
        id = "g4"
        members = [ "control-center" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.default.capsule_group]]
        fill = "surface"
        id = "g2"
        members = [ "notifications", "clipboard", "volume", "tray" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

        [[bar.default.capsule_group]]
        fill = "surface"
        id = "g5"
        members = [ "workspaces", "active_window" ]
        opacity = 1.0
        padding = 6.0
        radius = 5.0

[control_center]
width = 800

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[hooks]
colors_changed = "noctalia msg greeter-sync"
wallpaper_changed = "noctalia msg greeter-sync"

[lockscreen]
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
avatar_path = "/var/lib/AccountsService/icons/kim"
clipboard_image_action_command = "satty -f -"
font_family = "Inter SemiBold"
lang = "zh-Hans"
launch_apps_as_systemd_services = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.animation]
    speed = 1.8000000268220901

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"
    pipe_command = "satty -f -"
    pipe_to_command = true

[theme]
builtin = "Kanagawa"
community_palette = "Breeze"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "cava", "foot", "gtk3", "gtk4", "helix", "niri", "qt" ]
    community_ids = [ "zed", "papirus-icons", "telegram", "yazi" ]

[wallpaper]
directory = "/home/kim/Pictures/Wallpapers"
directory_dark = "/home/kim/Pictures/Wallpapers"
directory_light = "/home/kim/Pictures/Wallpapers"
fill_mode = "fit"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/kim/Pictures/Wallpapers/candy-09.jpg"

    [wallpaper.last]
    path = "/home/kim/Pictures/Wallpapers/candy-09.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/kim/Pictures/Wallpapers/candy-09.jpg"

[widget.active_window]
color = "primary"
display = "text_only"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.cat_2]
input_devices = [ "/dev/input/by-id/usb-BenQ_ZOWIE_BenQ_ZOWIE_Gaming_Mouse-event-mouse" ]
scale = 0.90000000000000013
type = "noctalia/bongocat:cat"

[widget.clock]
capsule_foreground = "primary"
capsule_opacity = 0.82000000000000006
capsule_radius = "auto"
font_family = "Inter ExtraBold"
font_weight = 800

[widget.control-center]
anchor = true
glyph = "topology-star-3"

[widget.custom_button_2]
type = "custom_button"

[widget.network]
show_label = false

[widget.session]
anchor = true

[widget.volume]
show_label = false

[widget.workspaces]
anchor = true
hide_when_empty = true